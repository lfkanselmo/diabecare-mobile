name: CI Mobile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar código (Riverpod/Drift)
        run: dart run build_runner build

      - name: Verificar paridad i18n (es/en)
        run: dart run tool/check_arb_parity.dart

      - name: Analizar
        run: flutter analyze

      - name: Tests
        run: flutter test --coverage
