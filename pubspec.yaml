name: diabecare_mobile
description: "DiabeCare — control de salud para pacientes diabeticos (Android/iOS)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  go_router: ^17.3.0
  drift: ^2.34.1
  path_provider: ^2.1.6
  path: ^1.9.1
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  local_auth: ^3.0.2
  connectivity_plus: ^7.2.0
  intl: ^0.20.2
  sqlite3: ^3.3.4
  fl_chart: ^1.1.1
  flutter_blue_plus: ^1.35.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4
  drift_dev: ^2.34.0
  mocktail: ^1.0.5
  http_mock_adapter: ^0.6.1
  flutter_secure_storage_platform_interface: ^2.0.1

flutter:
  uses-material-design: true
  generate: true
