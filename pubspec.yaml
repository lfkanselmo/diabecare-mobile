name: diabecare_mobile
description: "DiabeCare — control de salud para pacientes diabeticos (Android/iOS)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  go_router: ^17.3.0
  drift: ^2.34.1
  path_provider: ^2.1.6
  path: ^1.9.1
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  local_auth: ^3.0.2
  connectivity_plus: ^7.2.0
  intl: ^0.20.2
  sqlite3: ^3.3.4
  fl_chart: ^1.1.1
  flutter_blue_plus: ^1.35.5
  uuid: ^4.5.1
  mobile_scanner: ^7.1.2
  share_plus: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4
  drift_dev: ^2.34.0
  mocktail: ^1.0.5
  http_mock_adapter: ^0.6.1
  flutter_secure_storage_platform_interface: ^2.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  # Variable font de Inter (Google Fonts, licencia OFL en assets/fonts/OFL.txt)
  # — mismos 4 pesos que carga diabecare-web vía CDN (src/index.html). Un
  # solo archivo variable registrado 4 veces con distinto `weight` es el
  # patrón soportado por Flutter para variable fonts (Skia interpola).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700

# Ícono placeholder (gota simple sobre el color primario de marca) — a
# reemplazar cuando exista un logo de marca definitivo. Ver auditoría de
# diseño 2026-07 y Fase 7 del ROADMAP.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#5B4FCF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true

# Mismo criterio que el ícono: color primario de marca de fondo, la gota
# en blanco centrada. color_dark es una variante más oscura del mismo hue
# (no un token ya definido en AppColors) para que el splash no se sienta
# fuera de lugar en modo oscuro del sistema.
flutter_native_splash:
  color: "#5B4FCF"
  color_dark: "#2A2560"
  image: assets/icon/icon_foreground.png
  image_dark: assets/icon/icon_foreground.png
  android_12:
    image: assets/icon/icon_foreground.png
    icon_background_color: "#5B4FCF"
    image_dark: assets/icon/icon_foreground.png
    icon_background_color_dark: "#2A2560"
